name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  self-test:
    # macOS matters: users run these scripts on the system bash 3.2, which fails on things
    # bash 5 on Linux accepts (e.g. empty arrays under set -u).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run zero-quota self-test
        run: bash scripts/self-test.sh
